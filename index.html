  <link rel="icon" type="image/svg+xml" href="assets/svg/favicon.svg">

      1. add its <script> tag in the right group below, and
      2. add it to tests/manifest.js (in the same order) if it is safe to load in Node.
    tools/lint-rules.js fails if a file under js/ is missing here.
  -->
  <!-- core -->
  <script src="js/core/namespace.js"></script>
  <script src="js/core/strings.js"></script>
  <script src="js/core/util.js"></script>
  <script src="js/core/lessons.js"></script>

  <script src="js/core/numeral.js"></script>

  <!-- components (Phase 03) -->
  <!-- lessons (Phase 04+) -->
  <!-- boot (must be last) -->
