# Publish the app to GitHub Pages: https://pgdad.github.io/numeral-systems/
# On every push to master (and by hand from the Actions tab): unit tests + rule lint (tools/check.sh; the
# optional browser smoke test skips itself here, since Playwright isn't installed), then tools/build-dist.sh,
# then deploy dist/. See deploy/README.md "Other hosts".
name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check and build dist/
        run: tools/build-dist.sh
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
